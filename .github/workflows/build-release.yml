name: Build and Release GanHyperlink.exe

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate icon.ico
        run: python make_icon.py

      - name: Build EXE with PyInstaller
        run: pyinstaller GanHyperlink.spec --clean --noconfirm

      - name: Verify build output
        shell: pwsh
        run: |
          if (Test-Path "dist\GanHyperlink.exe") {
            $size = (Get-Item "dist\GanHyperlink.exe").length / 1MB
            Write-Host "Build SUCCESS: GanHyperlink.exe ($([math]::Round($size,2)) MB)"
          } else {
            Write-Host "Build FAILED: EXE not found!"
            exit 1
          }

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match "refs/tags/(.+)") {
            $version = $Matches[1]
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Compress to ZIP and prepare EXE
        id: compress
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $zipName = "GanHyperlink-$version-Windows-x64.zip"
          $exeName = "GanHyperlink-$version.exe"

          # Copy EXE with version name
          Copy-Item "dist\GanHyperlink.exe" -Destination $exeName -Force

          # Create ZIP containing the versioned EXE
          Compress-Archive -Path "dist\GanHyperlink.exe" -DestinationPath $zipName -Force

          $szZip = [math]::Round((Get-Item $zipName).length / 1MB, 2)
          $szExe = [math]::Round((Get-Item $exeName).length / 1MB, 2)
          Write-Host "EXE: $exeName ($szExe MB)"
          Write-Host "ZIP: $zipName ($szZip MB)"

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$exeName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GanHyperlink-${{ steps.get_version.outputs.VERSION }}-Windows-x64
          path: |
            ${{ steps.compress.outputs.EXE_NAME }}
            ${{ steps.compress.outputs.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GanHyperlink ${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.compress.outputs.EXE_NAME }}
            ${{ steps.compress.outputs.ZIP_NAME }}
          body: |
            ## GanHyperlink ${{ steps.get_version.outputs.VERSION }}

            Cong cu gan Hyperlink tu dong vao Word.

            ### Download:
            | File | Mo ta |
            |------|-------|
            | `GanHyperlink-${{ steps.get_version.outputs.VERSION }}.exe` | Chay truc tiep (can quyen Admin) |
            | `GanHyperlink-${{ steps.get_version.outputs.VERSION }}-Windows-x64.zip` | File nen, giai nen roi chay |

            **Yeu cau:** Windows 10/11 x64 - Khong can cai Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
